# ═══════════════════════════════════════════════════════════════════
# VVITU University Portal — Production Nginx Configuration
# Place at: /etc/nginx/sites-available/vvitu
# Symlink to: /etc/nginx/sites-enabled/vvitu
# ═══════════════════════════════════════════════════════════════════

# Upstream Gunicorn application server cluster
upstream vvitu_app {
    server 127.0.0.1:8000 fail_timeout=0;
    # Or unix socket: server unix:/run/gunicorn/vvitu.sock fail_timeout=0;
}

# ── HTTP Server (Redirect all traffic to secure HTTPS) ─────────────
server {
    listen 80;
    listen [::]:80;
    server_name portal.vvit.net www.portal.vvit.net 192.168.1.100;

    # Allow Let's Encrypt / Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Secure Server (SSL / TLS) ───────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.vvit.net www.portal.vvit.net 192.168.1.100;

    # SSL Certificates (Replace with your college domain certificates or Certbot paths)
    ssl_certificate /etc/letsencrypt/live/portal.vvit.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.vvit.net/privkey.pem;

    # Modern SSL Security Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Maximum file upload size (matches 10MB PDF & image uploads in portal)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression for high speed over campus WiFi/LAN
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # ── Static Files (Served directly by Nginx with 30-day browser cache) ──
    location /static/ {
        alias /var/www/vvitu/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # ── Uploaded Media Files (Protected profile pictures & question papers) ──
    location /media/ {
        alias /var/www/vvitu/media/;
        expires 7d;
        access_log off;
    }

    # ── Django Application (Proxy to Gunicorn WSGI) ───────────────────
    location / {
        proxy_pass http://vvitu_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSocket / Long Polling support for real-time notifications & chat
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for heavy PDF generation & Excel batch uploads
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Logging
    access_log /var/log/nginx/vvitu_access.log;
    error_log /var/log/nginx/vvitu_error.log;
}
