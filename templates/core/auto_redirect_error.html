<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="1;url={{ dashboard_url }}">
  <title>{{ error_title }} — VVITU Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0f172a 100%);
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-accent: #3b82f6;
    }
    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      overflow: hidden;
    }
    .redirect-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      animation: fadeInScale 0.4s ease-out forwards;
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .spinner-ring {
      width: 60px;
      height: 60px;
      margin: 0 auto 24px;
      border: 4px solid rgba(59, 130, 246, 0.2);
      border-top-color: var(--primary-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn-manual {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      transition: all 0.2s ease;
    }
    .btn-manual:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner-ring"></div>
    <h4 class="fw-bold mb-2">{{ error_title }}</h4>
    <p class="text-secondary small mb-3">{{ error_message }}</p>
    <div class="p-3 rounded mb-3" style="background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05);">
      <small class="text-info"><i class="fas fa-sync fa-spin me-2"></i>Refreshing & redirecting back to main dashboard...</small>
    </div>
    <a href="{{ dashboard_url }}" class="btn-manual">
      <i class="fas fa-home"></i> Return to Dashboard Immediately
    </a>
  </div>

  <script>
    // Automatic JavaScript redirect fallback
    setTimeout(function() {
      window.location.href = "{{ dashboard_url }}";
    }, 800);
  </script>
</body>
</html>
