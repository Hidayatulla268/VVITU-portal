{% extends "core/base.html" %}
{% block title %}Add Student{% endblock %}

{% block page_header %}
<div class="page-header-strip">
  <div class="ph-left">
    <h1 class="ph-title"><i class="fas fa-user-plus me-2 text-accent"></i>Add Student</h1>
    <p class="ph-sub">Create a new student account inside {{ department.name }} department</p>
  </div>
  <div class="ph-right">
    <a href="{% url 'hod:manage_students' %}" class="btn-vvit-outline"><i class="fas fa-arrow-left me-2"></i>Back</a>
  </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="glass-card">
      <form method="post">
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label text-muted">Roll Number / Username</label>
            <input type="text" name="username" class="vvit-input" placeholder="24BQ1A4901" required>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Default Password</label>
            <input type="text" name="password" class="vvit-input" value="vvit@1234" required>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">First Name</label>
            <input type="text" name="first_name" class="vvit-input" required>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Last Name</label>
            <input type="text" name="last_name" class="vvit-input" required>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Phone Number</label>
            <input type="text" name="phone" class="vvit-input">
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Email ID (Optional)</label>
            <input type="email" name="email" class="vvit-input" placeholder="e.g. name@example.com">
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Year Level</label>
            <select name="year" class="vvit-select" required>
              <option value="">— Select Year —</option>
              {% for yr in years %}
              <option value="{{ yr.id }}">{{ yr }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Section</label>
            <select name="section" class="vvit-select" required>
              <option value="">— Select Section —</option>
              {% for sec in sections %}
              <option value="{{ sec.id }}">{{ sec }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Admission Year</label>
            <input type="number" name="admission_year" class="vvit-input" value="2024" required>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Class Teacher</label>
            <select name="class_teacher" class="vvit-select">
              <option value="">— Select —</option>
              {% for fac in faculties %}
              <option value="{{ fac.id }}">{{ fac.user.get_full_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Counsellor</label>
            <select name="counsellor" class="vvit-select">
              <option value="">— Select —</option>
              {% for fac in faculties %}
              <option value="{{ fac.id }}">{{ fac.user.get_full_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Parent / Guardian Name</label>
            <input type="text" name="parent_name" class="vvit-input">
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Parent Occupation / Work</label>
            <input type="text" name="parent_occupation" class="vvit-input" placeholder="e.g. Business / Service">
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Parent Mobile</label>
            <input type="text" name="parent_mobile" class="vvit-input">
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Student Personal Mobile</label>
            <input type="text" name="personal_mobile" class="vvit-input" placeholder="+91 XXXXXXXXXX">
          </div>

          <div class="col-md-4">
            <label class="form-label text-muted">Gender</label>
            <select name="gender" class="vvit-select">
              <option value="">— Select —</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted">Caste Category</label>
            <input type="text" name="caste" class="vvit-input" placeholder="e.g. OC / BC-A / SC / ST">
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted">Religion</label>
            <input type="text" name="religion" class="vvit-input" placeholder="e.g. Hindu / Muslim / Christian">
          </div>

          <div class="col-md-12">
            <label class="form-label text-muted fw-bold text-accent"><i class="fas fa-wallet me-1"></i>Fees Pending Amount (₹)</label>
            <input type="number" step="0.01" min="0" name="fees_pending" class="vvit-input" value="0.00" placeholder="0.00">
          </div>

          <div class="col-md-6">
            <label class="form-label text-muted">Permanent Address</label>
            <textarea name="permanent_address" class="vvit-input" rows="2" placeholder="Full permanent address"></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted">Present / Local Address</label>
            <textarea name="present_address" class="vvit-input" rows="2" placeholder="Present hostel/local address"></textarea>
          </div>
        </div>
        <div class="mt-4">
          <button type="submit" class="btn-vvit-primary w-100 py-3"><i class="fas fa-save me-2"></i>Create Student Account</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
