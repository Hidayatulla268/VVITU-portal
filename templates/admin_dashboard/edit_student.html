{% extends "core/base.html" %}
{% load static %}
{% load core_tags %}
{% block title %}Edit Student{% endblock %}
{% block page_header %}
<div class="page-header-strip">
  <div class="ph-left">
    <h1 class="ph-title"><i class="fas fa-user-edit me-2 text-accent"></i>Edit Student</h1>
    <p class="ph-sub">{{ student.roll_number }} — {{ student.user.get_full_name }}</p>
  </div>
</div>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-8">
    <div class="glass-card">
      <form method="post" class="row g-4">
        {% csrf_token %}
        <div class="col-md-6">
          <label class="form-label text-muted">First Name</label>
          <input type="text" name="first_name" class="vvit-input" value="{{ student.user.first_name }}" required/>
        </div>
        <div class="col-md-6">
          <label class="form-label text-muted">Last Name</label>
          <input type="text" name="last_name" class="vvit-input" value="{{ student.user.last_name }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label text-muted">Email ID (Optional)</label>
          <input type="email" name="email" class="vvit-input" value="{{ student.user.email|default:'' }}" placeholder="e.g. name@example.com"/>
        </div>
        <div class="col-md-6">
          <label class="form-label text-muted">Phone</label>
          <input type="tel" name="phone" class="vvit-input" value="{{ student.user.phone|default:'' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label text-muted">New Password (Optional)</label>
          <input type="password" name="password" class="vvit-input" placeholder="Leave blank to keep current password" minlength="6"/>
        </div>
        <div class="col-md-6">
          <label class="form-label text-muted">Parent Name</label>
          <input type="text" name="parent_name" class="vvit-input" value="{{ student.parent_name|default:'' }}" placeholder="e.g. Satyanarayana"/>
        </div>
        <div class="col-md-6">
          <label class="form-label text-muted">Parent Occupation / Work</label>
          <input type="text" name="parent_occupation" class="vvit-input" value="{{ student.parent_occupation|default:'' }}" placeholder="e.g. Business / Service"/>
        </div>
        <div class="col-md-6">
          <label class="form-label text-muted">Parent Mobile</label>
          <input type="tel" name="parent_mobile" class="vvit-input" value="{{ student.parent_mobile|default:'' }}" placeholder="+91 XXXXXXXXXX"/>
        </div>
        <div class="col-md-6">
          <label class="form-label text-muted">Student Personal Mobile</label>
          <input type="tel" name="personal_mobile" class="vvit-input" value="{{ student.personal_mobile|default:student.user.phone|default:'' }}" placeholder="+91 XXXXXXXXXX"/>
        </div>

        <div class="col-md-4">
          <label class="form-label text-muted">Gender</label>
          <select name="gender" class="vvit-select">
            <option value="">— Select —</option>
            <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label text-muted">Caste Category</label>
          <input type="text" name="caste" class="vvit-input" value="{{ student.caste|default:'' }}" placeholder="e.g. OC / BC-A / SC / ST"/>
        </div>
        <div class="col-md-4">
          <label class="form-label text-muted">Religion</label>
          <input type="text" name="religion" class="vvit-input" value="{{ student.religion|default:'' }}" placeholder="e.g. Hindu / Muslim / Christian"/>
        </div>

        <div class="col-md-12">
          <label class="form-label text-muted fw-bold text-accent"><i class="fas fa-wallet me-1"></i>Fees Pending Amount (₹)</label>
          <input type="number" step="0.01" min="0" name="fees_pending" class="vvit-input" value="{{ student.fees_pending|default:0 }}" placeholder="0.00"/>
        </div>

        <div class="col-md-6">
          <label class="form-label text-muted">Permanent Address</label>
          <textarea name="permanent_address" class="vvit-input" rows="2" placeholder="Full permanent home address">{{ student.permanent_address|default:'' }}</textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label text-muted">Present / Local Address</label>
          <textarea name="present_address" class="vvit-input" rows="2" placeholder="Present hostel/local address">{{ student.present_address|default:'' }}</textarea>
        </div>

        <div class="col-md-4">
          <label class="form-label text-muted">Branch</label>
          <select name="branch" class="vvit-select">
            {% for b in branches %}<option value="{{ b.id }}" {% if student.branch_id == b.id %}selected{% endif %}>{{ b.code }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label text-muted">Year</label>
          <select name="year" class="vvit-select">
            {% for y in years %}<option value="{{ y.id }}" {% if student.year_id == y.id %}selected{% endif %}>{{ y }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label text-muted">Section</label>
          <select name="section" class="vvit-select">
            {% for s in sections %}<option value="{{ s.id }}" {% if student.section_id == s.id %}selected{% endif %}>{{ s }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label text-muted">Class Teacher</label>
          <select name="class_teacher" class="vvit-select">
            <option value="">— None —</option>
            {% for f in faculties %}<option value="{{ f.id }}" {% if student.class_teacher_id == f.id %}selected{% endif %}>{{ f.employee_id }} — {{ f.user.get_full_name }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label text-muted">Counsellor</label>
          <select name="counsellor" class="vvit-select">
            <option value="">— None —</option>
            {% for f in faculties %}<option value="{{ f.id }}" {% if student.counsellor_id == f.id %}selected{% endif %}>{{ f.employee_id }} — {{ f.user.get_full_name }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-12 d-flex gap-3">
          <button type="submit" class="btn-vvit-primary"><i class="fas fa-save me-2"></i>Update Student</button>
          <a href="{% url 'admin_dashboard:manage_students' %}" class="btn-vvit-outline">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
